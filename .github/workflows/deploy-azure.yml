# Despliegue a Azure Container Apps. Manual a propósito (workflow_dispatch): el push a
# main sigue desplegando al VPS con deploy.yml; Azure se actualiza cuando alguien lo pide.
#
# Qué hace: construye y publica la imagen caddy-azure (Caddy + SPA, ver
# infra/azure/Dockerfile.caddy) a partir de la imagen web ya publicada, lanza el migrator
# y mueve api/caddy/jobs a la etiqueta pedida con `az containerapp update`. La
# infraestructura en sí la gestiona terraform (infra/azure); la siguiente ejecución de
# terraform debe aplicar el mismo image_tag para no deshacer esto.
#
# Secretos de repositorio necesarios (login OIDC, sin contraseñas):
#   AZURE_CLIENT_ID       app registration con federated credential para este repo
#   AZURE_TENANT_ID       tenant
#   AZURE_SUBSCRIPTION_ID suscripción
# La app registration necesita el rol Contributor sobre los resource groups
# rg-inkoova-academy-prod / rg-inkoova-academy-staging.
# Cómo crearla: https://learn.microsoft.com/azure/developer/github/connect-from-azure-openid-connect

name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno de destino
        type: choice
        options: [prod, staging]
        default: staging
      image_tag:
        description: "Etiqueta de las imágenes en GHCR (SHA de un build ya publicado, o latest)"
        type: string
        default: latest

concurrency:
  group: deploy-azure-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RESOURCE_GROUP: rg-inkoova-academy-${{ inputs.environment }}

jobs:
  build-caddy:
    name: Build caddy-azure image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Encadenada a la imagen web del mismo tag: si el tag es un SHA, la SPA desplegada
      # es exactamente la de ese commit.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/azure/Dockerfile.caddy
          push: true
          build-args: |
            WEB_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/web:${{ inputs.image_tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/caddy-azure:${{ inputs.image_tag }}
          cache-from: type=gha,scope=caddy-azure
          cache-to: type=gha,mode=max,scope=caddy-azure

  deploy:
    name: Update container apps
    needs: build-caddy
    runs-on: ubuntu-latest
    environment: azure-${{ inputs.environment }}
    permissions:
      id-token: write # OIDC para azure/login
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Migraciones ANTES de mover la API: mismo orden que el depends_on del VPS.
      - name: Run database migrations
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          TAG="${{ inputs.image_tag }}"
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/migrator:$TAG"

          az containerapp job update -g "$RESOURCE_GROUP" -n "job-migrator-$ENV" --image "$IMAGE" --output none
          EXEC=$(az containerapp job start -g "$RESOURCE_GROUP" -n "job-migrator-$ENV" --query name -o tsv)
          echo "Ejecución del migrator: $EXEC"

          for attempt in $(seq 1 60); do
            STATUS=$(az containerapp job execution show -g "$RESOURCE_GROUP" -n "job-migrator-$ENV" \
              --job-execution-name "$EXEC" --query properties.status -o tsv)
            case "$STATUS" in
              Succeeded) echo "Migraciones aplicadas."; exit 0 ;;
              Failed|Stopped) echo "El migrator terminó en $STATUS." >&2; exit 1 ;;
              *) echo "Migrator: $STATUS (intento $attempt)…"; sleep 5 ;;
            esac
          done
          echo "El migrator no terminó a tiempo." >&2
          exit 1

      - name: Update apps
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          TAG="${{ inputs.image_tag }}"
          BASE="${{ env.REGISTRY }}/${{ github.repository }}"

          az containerapp update -g "$RESOURCE_GROUP" -n "ca-api-$ENV"   --image "$BASE/api:$TAG"         --output none
          az containerapp update -g "$RESOURCE_GROUP" -n "ca-caddy-$ENV" --image "$BASE/caddy-azure:$TAG" --output none

          # En staging la app de jobs no existe (enable_jobs=false): no es un error.
          if az containerapp show -g "$RESOURCE_GROUP" -n "ca-jobs-$ENV" --output none 2>/dev/null; then
            az containerapp update -g "$RESOURCE_GROUP" -n "ca-jobs-$ENV" --image "$BASE/jobs:$TAG" --output none
          else
            echo "ca-jobs-$ENV no existe en este entorno; se omite."
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "ca-caddy-${{ inputs.environment }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in $(seq 1 20); do
            if curl -fsS "https://$FQDN/health/ready" > /dev/null; then
              echo "Despliegue verificado en https://$FQDN"
              exit 0
            fi
            echo "Esperando a que la API responda (intento $attempt)…"
            sleep 6
          done
          echo "La API no respondió tras el despliegue." >&2
          exit 1
