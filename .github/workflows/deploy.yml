name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez: dos `docker compose up` simultáneos en la misma VPS se pisan.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web, jobs, migrator]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.image }}
          push: true
          # El SHA es la etiqueta real; `latest` solo existe para el arranque inicial.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and restart over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/inkoova-academy
            git pull --ff-only
            cd infra

            # El despliegue fija la etiqueta al SHA para que un rollback sea cambiar un valor.
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker image prune -f

      - name: Smoke test
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS "https://${{ secrets.ACADEMY_DOMAIN }}/health/ready" > /dev/null; then
              echo "Despliegue verificado."
              exit 0
            fi
            echo "Esperando a que la API responda (intento $attempt)…"
            sleep 6
          done
          echo "La API no respondió tras el despliegue." >&2
          exit 1
